server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: haode-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://127.0.0.1:8081}
              predicates:
                - Path=/api/products,/api/products/**,/api/orders/**,/api/auth/**,/api/users/**,/api/reviews/**,/api/after-sales/**,/api/admin/**,/api/media/**
              filters:
                - StripPrefix=0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
